<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝の鳥獣判別トレーニング</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #333; font-size: 18px; }
        .img-container {
            width: 100%;
            height: 220px;
            background: #f1f2f6;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            overflow: hidden;
        }
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .animal-name {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            color: #2c3e50;
        }
        .hint {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 15px;
            min-height: 50px;
            line-height: 1.4;
            text-align: left;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            width: 100%;
            max-width: 250px;
            transition: background 0.2s;
        }
        button:hover { background: #219653; }
        .next-btn { background: #2980b9; }
        .next-btn:hover { background: #2471a3; }
        .answer-box {
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
        .ok { background: #d4edda; color: #155724; }
        .ng { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🦊 朝の鳥獣判別トレーニング</h2>
        <div class="img-container">
            <img id="animal-img" src="" alt="動物の画像">
        </div>

        <div id="animal-name" class="animal-name">読み込み中...</div>
        
        <button onclick="showAnswer()">答えを確認する</button>
        
        <div id="answer-box" class="answer-box"></div>
        <div id="hint" class="hint"></div>
        
        <button class="next-btn" onclick="nextCard()">次の動物へ ➔</button>
    </div>

    <script>
        // 動物データリスト
        const animals = [
            { 
                name: "タヌキ", 
                img: "images/tanuki.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "目の周りに黒いマスク模様がある。足が短く丸っこい。" 
            },
            { 
                name: "アナグマ", 
                img: "images/anaguma.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "鼻から耳にかけて白い縦じまがある。爪が鋭く長い。" 
            },
            { 
                name: "ハクビシン", 
                img: "images/hakubishin.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "額から鼻にかけて1本の白い線（鼻筋の白線）。尾が長い。" 
            },
            { 
                name: "キジ（オス）", 
                img: "images/kiji_male.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "体色が鮮やかで、長い尾を持つ。国の鳥。" 
            },
            { 
                name: "キジ（メス）", 
                img: "images/kiji_female.jpeg", 
                status: "【 狩猟NG 】 保護鳥獣", 
                type: "ng", 
                hint: "地味な茶褐色。メスは子育てのため原則保護！" 
            },
            { 
                name: "テン", 
                img: "images/ten.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "ツシマテンは固有亜種でNG。夏毛は黄褐色で顔黒、冬毛は明るい黄褐色で顔白。" 
            },
            { 
                name: "イタチ", 
                img: "images/itachi.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "⚠️イタチのメスは非狩猟獣（保護）。対馬のシベリアイタチは捕獲禁止。" 
            },
            { 
                name: "ミンク", 
                img: "images/minku.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "北海道に分布する北米原産の外来種。褐色系の毛皮獣が野化。" 
            },
            { 
                name: "タイワンリス", 
                img: "images/taiwan_risu.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "伊豆大島や神奈川等に分布する外来種。ニホンリス（非狩猟獣）と似るので注意。" 
            },
            { 
                name: "シマリス", 
                img: "images/shima_risu.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "北海道のみ（本州等は外来種のチョウセンシマリス）。狩猟獣で一番小さい。背中に縦縞。" 
            },
            { 
                name: "ムクドリ", 
                img: "images/mukudori.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "全国的におなじみ。田畑の虫を食べる益鳥の一面もあるが果樹等に加害も。" 
            },
            { 
                name: "ヒヨドリ", 
                img: "images/hiyodori.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "全国の森林や市街地で見られる。秋頃から人里へ移動する昼行性の鳥。" 
            },
            { 
                name: "タシギ", 
                img: "images/tashigi.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "湿地や水辺に渡来。ヤマシギと合計して1日5羽までの制限あり。" 
            },
            { 
                name: "ヤマシギ", 
                img: "images/yamashigi.jpg", 
                status: "【 狩猟OK 】 狩猟鳥獣", 
                type: "ok", 
                hint: "森林にすむシギ。南西諸島のアマミヤマシギは非狩猟鳥なので注意。" 
            }
        ];

        let currentIndex = 0;

        // 配列をランダムにシャッフルする関数 (Fisher-Yatesアルゴリズム)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function init() {
            shuffle(animals);
            currentIndex = 0;
            displayCard();
        }

        function displayCard() {
            const current = animals[currentIndex];
            document.getElementById('animal-img').src = current.img;
            document.getElementById('animal-img').alt = current.name;
            document.getElementById('animal-name').innerText = current.name;
            
            // ヒントと答えを一旦非表示・リセット
            document.getElementById('hint').style.display = 'none';
            document.getElementById('hint').innerText = current.hint;
            
            const box = document.getElementById('answer-box');
            box.style.display = 'none';
            box.innerText = current.status;
            box.className = `answer-box ${current.type}`;
        }

        function showAnswer() {
            document.getElementById('answer-box').style.display = 'block';
            document.getElementById('hint').style.display = 'block';
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex >= animals.length) {
                shuffle(animals);
                currentIndex = 0;
            }
            displayCard();
        }

        // 起動時に初期化
        init();
    </script>
</body>
</html>
